[project]
name = "podcast2md"
version = "0.1.0"
description = "Turn podcasts and audio into readable Markdown with local MLX Whisper."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.12",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
    "yt-dlp>=2026.7.4",
    "python-dotenv>=1.0.1",
    "fastapi>=0.135.3",
    "uvicorn>=0.42.0",
    "httpx>=0.28.1",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.32",
    "socksio>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/xielevi/read-podcast"
Repository = "https://github.com/xielevi/read-podcast"
Issues = "https://github.com/xielevi/read-podcast/issues"

[project.optional-dependencies]
mlx = [
    "numpy>=1.26.4",
    "mlx-whisper>=0.4.1 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.pytest.ini_options]
pythonpath = ["."]

[project]
name = "read-podcast"
version = "0.3.0"
description = "Turn podcasts and audio into readable Markdown with local MLX Whisper."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.12",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
    "yt-dlp>=2026.7.4",
    "python-dotenv>=1.0.1",
    "fastapi>=0.135.3",
    "uvicorn>=0.42.0",
    "httpx>=0.28.1",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.32",
    "socksio>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/xielevi/read-podcast"
Repository = "https://github.com/xielevi/read-podcast"
Issues = "https://github.com/xielevi/read-podcast/issues"

[project.optional-dependencies]
mlx = [
    # numpy 由 mlx-whisper 自己带入；这里不再重复声明——之前那条没有平台标记，
    # 会让非 Apple Silicon 平台的 `--extra mlx` 装一个谁都用不上的 numpy。
    "mlx-whisper>=0.4.1 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.8",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv", "workspace", "dist"]

[tool.ruff.lint]
# 稳定线上刻意保守：显式钉住规则集（pyflakes F + pycodestyle E4/E7/E9），只抓真问题
# （未用/未定义名、语法错误、明显缩进/语句错误），不做风格化改动、不强制行宽，
# 避免冻结前的大面积 churn，也不随 ruff 默认集升级而漂移。需要更严时再逐步加规则。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# CLI 入口脚本与测试在导入项目模块前需要先 sys.path 引导，E402 属预期。
"scripts/**" = ["E402"]
"tests/**" = ["E402"]

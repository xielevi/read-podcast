[project]
name = "read-podcast-transcription-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135.3",
  "httpx>=0.28.1",
  "python-multipart>=0.0.22",
  "uvicorn>=0.42.0",
  # 音频源获取与出站安全（core/*）的依赖。
  "requests>=2.32.0",
  # reference deployment 的本机引擎（Apple Silicon）。
  "mlx-whisper>=0.4.3 ; sys_platform == 'darwin'",
  # 其余平台（Linux / Windows / NAS / 容器）的进程内引擎（CPU / CUDA）。
  "faster-whisper>=1.1.0 ; sys_platform != 'darwin'",
]

[dependency-groups]
dev = ["pytest>=9.0.3"]

[tool.pytest.ini_options]
pythonpath = ["."]

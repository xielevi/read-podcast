# Read Podcast 转录容器参考部署（compose）。
#
# 镜像由 CI 发布到 GHCR（见 .github/workflows/transcription-image.yml）；把
# your-github-username 换成你的 GitHub 用户名，或指向你自己的镜像仓库地址。
# 远程认证由 Cloudflare Access / Tunnel 承担：端口只绑定在宿主机回环地址上。
services:
  transcription:
    image: ghcr.io/your-github-username/read-podcast-transcription:latest
    ports:
      - "127.0.0.1:28100:28100"
    volumes:
      # 模型缓存（HF_HOME）、已完成结果与日志的唯一可写根。
      - transcription-data:/data
    # 最小权限运行：镜像内已是非 root 用户，这里再剥离全部 Linux capabilities。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # 如需使用 OpenAI 兼容上传代理模式（openai-proxy），配置如下环境变量：
    # environment:
    #   - READ_PODCAST_TRANSCRIPTION_ENGINE=openai-proxy
    #   - READ_PODCAST_OPENAI_API_BASE=https://api.openai.com/v1
    #   - READ_PODCAST_OPENAI_API_KEY=${READ_PODCAST_OPENAI_API_KEY}
    #   - READ_PODCAST_OPENAI_MODEL=whisper-1
    restart: unless-stopped

volumes:
  transcription-data:

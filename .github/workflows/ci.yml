name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: uv run pytest -q

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          python-version: "3.12"
      - name: Ruff lint
        run: uv run ruff check .
      - name: Python bytecode compile
        run: uv run python -m compileall -q app modules scripts services
      - name: Shell syntax (bash -n)
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # 门禁到 warning：warning/error 一律失败；info/style 级提示（如 SC2015
          # 对 `A && B || C` 的说明，此处均为有意写法）不阻断构建。
          shellcheck -x --severity=warning scripts/*.sh
      - name: JavaScript syntax (node --check)
        run: |
          for f in app/static/js/*.js; do node --check "$f"; done
          node --check app/static/app.js
      - name: Frontend bundle up to date
        run: uv run python scripts/build_frontend.py --check
      - name: Release version format
        run: uv run python scripts/check_release.py --version-only

  packaging-dry-run:
    # 打包本身要在维护者的 Apple Silicon Mac 上带证书跑（见 docs/release.md）。
    # CI 只做无签名的静态校验，确保打包脚本不会在发布当天才炸。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Packaging script dry run
        run: bash scripts/pack_macos.sh --check

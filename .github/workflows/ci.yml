name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # 杜绝 Git 冲突标记残存
      - run: "! git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- ."
      # 前端语法校验（打包物与各分片逐一校验）
      - run: node --check public/app.js
      - run: for f in public/js/*.js; do node --check "$f"; done
      # 前端分片与 app.js 不得漂移（无构建工具的经典脚本，纯字节拼接）。
      - run: python3 scripts/build_frontend.py --check

  transcription-service:
    # 服务与 macOS 无关：Linux 即可完整验证 Cloudflare-facing 协议与全部单元测试。
    # （MLX 引擎依赖只在 darwin 上安装；测试通过 stub / 假引擎覆盖，不需要真实模型。）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --directory transcription_service --dev --locked
      - run: uv run --directory transcription_service pytest -q

  # 生产发布（CD）。仅当 push 到 main、且 edge / transcription-service 两个 CI job 全部成功后执行；
  # PR 事件下本 job 直接跳过（PR 只跑检查，永不部署）。
  # 部署值来自 GitHub Actions 仓库变量（Settings → Secrets and variables → Actions → Variables），
  # 仓库里不写任何部署者自己的域名 / 仓库名。没有设置 READ_PODCAST_DOMAIN 的仓库（例如 fork）
  # 整个 job 跳过。变量含义见 docs/DEPLOYMENT.md（Continuous deployment）。
  deploy-production:
    name: Deploy production
    needs: [edge, transcription-service]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.READ_PODCAST_DOMAIN != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      READ_PODCAST_DOMAIN: ${{ vars.READ_PODCAST_DOMAIN }}
      READ_PODCAST_TRANSCRIPTION_URL: ${{ vars.READ_PODCAST_TRANSCRIPTION_URL }}
      READ_PODCAST_GITHUB_OWNER: ${{ vars.READ_PODCAST_GITHUB_OWNER }}
      READ_PODCAST_GITHUB_REPO: ${{ vars.READ_PODCAST_GITHUB_REPO }}
      READ_PODCAST_GITHUB_BRANCH: ${{ vars.READ_PODCAST_GITHUB_BRANCH }}
      READ_PODCAST_GITHUB_PATH: ${{ vars.READ_PODCAST_GITHUB_PATH }}
      READ_PODCAST_TRANSCRIPTION_LANGUAGE: ${{ vars.READ_PODCAST_TRANSCRIPTION_LANGUAGE }}
      READ_PODCAST_TIME_ZONE: ${{ vars.READ_PODCAST_TIME_ZONE }}
    # 同一时间只允许一个生产部署；新的 main 提交会取消尚未开始/仍在进行的旧部署。
    concurrency:
      group: read-podcast-edge-production
      cancel-in-progress: true
    steps:
      # 部署触发本次 workflow 的确切 commit。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm
      # npm ci 是部署的硬前提，不要删除：
      # 1) 部署使用 package-lock.json 锁定的 wrangler 版本，与本地一致；
      # 2) Worker 入口依赖 fast-xml-parser，需要 node_modules 才能被 wrangler 打包。
      - run: npm ci
      # 与本地相同的部署入口：scripts/deploy.mjs 校验上面的部署值，并以 --domain / --var 注入 wrangler deploy。
      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      # 记录本次上线的 Version / Deployment（wrangler 部署输出本身也会保留在日志里）。
      - name: Record deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deployments status --name read-podcast-edge
          echo '--- recent deployments ---'
          npx wrangler deployments list --name read-podcast-edge | head -40
      # 边缘冒烟（最终 Access 边界）：
      #   - 公开浏览（/、/api/public/*）必须匿名直达并返回 200；
      #   - 控制面（/manage*、/api/control/*）必须由 Cloudflare Access 拦截。
      # 任何一侧退化都让 production deploy 失败，避免整站误加 Access 或控制面意外裸露。
      # 更完整的 authenticated smoke 由人工 / Hermes production audit 承担。
      - name: Smoke test (edge, Access boundary)
        run: |
          set -euo pipefail
          base="https://${READ_PODCAST_DOMAIN}"
          probe() {
            local out
            if ! out=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code} %{redirect_url}' "$base$1"); then
              echo "FAIL: $base$1 unreachable" >&2; return 1
            fi
            echo "$out"
          }

          # Public Browse Mode is intentionally anonymous. Redirecting to Access is a regression.
          for path in / /api/public/health /api/public/articles?limit=1 /api/public/subscriptions /api/public/preferences; do
            out=$(probe "$path"); code=${out%% *}; loc=${out#* }
            echo "GET $path -> $code ${loc:+(redirect: $loc)}"
            if [ "$code" != "200" ]; then
              echo "FAIL: public surface must be anonymously reachable with HTTP 200"; exit 1
            fi
          done

          # Owner Workspace / control APIs must never answer anonymously.
          for path in /manage /api/control/tasks /api/control/settings; do
            out=$(probe "$path"); code=${out%% *}; loc=${out#* }
            echo "GET $path -> $code ${loc:+(redirect: $loc)}"
            case "$code" in
              401|403) echo "PASS: control plane denied";;
              301|302|303)
                case "$loc" in
                  *cloudflareaccess.com*) echo "PASS: control plane gated by Access";;
                  *) echo "FAIL: unexpected redirect -> $loc"; exit 1;;
                esac;;
              200) echo "FAIL: control plane answered an anonymous request — Access does not cover $path"; exit 1;;
              *) echo "FAIL: unexpected status $code"; exit 1;;
            esac
          done

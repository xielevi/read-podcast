name: Transcription image

# 转录服务的容器镜像（进程内 Faster-Whisper 引擎，见 transcription_service/Dockerfile）。
# - PR：只构建验证（amd64 + arm64），不登录、不推送；
# - push 到 main：发布到 GHCR（ghcr.io/<owner>/read-podcast-transcription）。
# 构建不下载任何 Whisper 模型；模型由容器在首次转录时下载到挂载卷。
on:
  push:
    branches: [main]
    paths:
      - "transcription_service/**"
      - ".github/workflows/transcription-image.yml"
  pull_request:
    paths:
      - "transcription_service/**"
      - ".github/workflows/transcription-image.yml"

permissions:
  contents: read

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 仅 push 到 main 时用于推送 GHCR；PR 构建不会用到
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU（arm64 交叉构建）
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 只有发布（push main）才需要登录；PR 只构建验证。
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata（镜像名与 tag）
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/read-podcast-transcription
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./transcription_service
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# 内置默认配置（随镜像发布，不复制到持久化覆盖文件）
# 普通配置集中在这里；持久化 config/config.yaml 可覆盖。
# 机密（API Key、Token、Basic Auth 凭据）只放 .env。

paths:
  download_dir: workspace/downloads
  transfer_txt_dir: workspace/transfer_txt
  state_file: workspace/data/podcast_state.json
  log_dir: workspace/log
  # Docker Compose overrides this with the mounted /data/output directory.
  obsidian_markdown_dir: ""

runtime:
  audio_retention_days: 7
  cleanup_interval_seconds: 86400
  max_upload_bytes: 2147483648
  max_download_bytes: 2147483648
  max_rss_bytes: 10485760
  download_timeout_seconds: 1800
  download_concurrency: 2
  refine_concurrency: 2
  debug: false

web:
  base_path: ""

mlx:
  model: mlx-community/whisper-large-v3-turbo
  host: 127.0.0.1
  port: 21567
  max_upload_bytes: 2147483648
  chunk_duration: 600
  chunk_workers: 2
  model_idle_seconds: 300
  shared_audio_root: workspace

# ── 精修引擎（AI 整理原始转录→精修稿）──
# 任何“OpenAI 兼容”的服务商都可使用。下面两行是占位符，必须改成你所用服务商的
# 地址和模型名，并在 .env 里填 REFINER_API_KEY，否则精修会失败。
# 详细申请步骤见 README「申请 AI Key」。常见选择：
#   免费（新手推荐，注册即用免充值）OpenCode Zen：
#     api_base https://opencode.ai/zen/v1   model 见其免费模型列表（会更新，以官网为准）
#   便宜付费 DeepSeek：
#     api_base https://api.deepseek.com/v1  model deepseek-chat
#   OpenAI：
#     api_base https://api.openai.com/v1    model gpt-4o-mini
#   通义千问：
#     api_base https://dashscope.aliyuncs.com/compatible-mode/v1  model qwen-plus
refiner:
  api_base: https://api.your-provider.com/v1
  model: your-model-name
  # api_key 只从 .env 的 REFINER_API_KEY 读取
  max_tokens: 65536
  temperature: 0.3
  max_retries: 3
  timeout: 600                           # 请求超时秒数
  # RSS 单集精修 prompt（含 {summary} 占位符，运行时替换为节目简介）。
  refine_prompt: |
    # 播客全文杂志级精修 Prompt

    ## 任务定位

    你是一位知名文化/商业杂志（如《GQ》《纽约客》《人物》）的高级对话编辑。

    你的使命是：将原始 ASR 转录稿整理成兼具**完整原汁原味声像推演**与**高质感杂志访谈排版**的精品稿件。读者读完精修稿，应如同完整听完该期节目。你的输出是包含完整对话信息的访谈文稿，绝对不是摘要、提纲或读书笔记。

    ## 节目背景与官方简介

    {summary}

    ## 工作流程

    请在内部按以下顺序处理，但最终只输出成稿，不输出分析过程：

    1. **提取官方时间线与大纲**：解析节目背景 `{summary}` 中包含的官方时间节点（如 `01:20`、`15:45`），在正文最上方整理生成 `### 📌 节目大纲与时间线` 区块。若简介中无明显时间线，则根据全文自然话题生成简明时间线。
    2. **识别说话人真实姓名**：从节目简介 `{summary}`、标题或开场对话中识别主播/主持人与嘉宾的具体姓名（例如 **程衍樑**、**许知远**）。全篇对话直接标注具体姓名（例如 `**程衍樑**：`、`**许知远**：`）。仅在彻底无法获知姓名时，使用 `**[主持人]**：` 或 `**[嘉宾]**：`。
    3. **清洗 ASR 噪音**：剔除无意义的“嗯、啊、那个、就是说、然后然后”等纯卡顿语气词；修正错别字、不连贯标点与断句。
    4. **保留全部实质内容**：保留所有论点、论据、案例、追问、反驳、玩笑、迟疑、语气与逻辑推演过程。
    5. **杂志风分段与标题**：按话题自然分段，在主要话题转换处插入形如 `## 01 | 话题标题` 的优雅二级标题。

    ## 可做的改写

    - 可以合并同一说话人连续、含义相连的短碎句，但不得跨话题合并。
    - 可以把明显口误与颠三倒四的病句修饰成通顺的对话表达。
    - 可以把错乱标点恢复成标准中文标点。
    - 可以删除纯卡顿、重复半句、无意义语气词；除此之外默认全留。
    - 保持自然流畅的口语对谈感，让对话充满现场临场感。

    ## 禁止的改写

    - **严禁摘要、概括、提炼**：不要把长篇发言压缩成“本节讨论了……”等提纲式句子。
    - 不要“优化结构”到改变原文说话顺序。
    - 不要把第一人称对话改成第三人称转述。
    - 不要删除论证过程、细节或案例，只保留结论。
    - 不要补充原文没有的评价、外部知识或解释。
    - 不要输出金句块、框选引言或 YAML frontmatter。
    - 不要输出“以下是精修稿”等自我说明。

    ## 硬性长度要求

    - 精修稿非空白字符数必须至少达到原始转录的 **90% 以上**。
    - 10% 的裁剪空间仅供去除纯卡顿与重复口头禅，绝非删减内容的目标。
    - 如果不确定某段对话是否该删，默认保留。

    ## 输出格式

    直接输出 Markdown 正文，格式如下：

    ```markdown
    ### 📌 节目大纲与时间线
    - **01:20** 话题一说明
    - **15:45** 话题二说明

    ---

    ## 01 | 话题标题

    **程衍樑**：整理后的发言。

    **许知远**：整理后的发言。
    ```

    除正文外，不要输出任何解释。

# ── 转录引擎（音频→原始文本）──
# backend 选择转录后端：
#   mlx-api（默认）：调用宿主机原生 MLX Whisper 服务，仅 Apple Silicon Mac。
#   openai-api：调用任意 OpenAI 兼容的 /audio/transcriptions 接口，与平台无关，
#               可在 Windows / Linux / Intel Mac 上运行，无需本机 MLX 进程。
transcription:
  backend: mlx-api

  # —— mlx-api 后端（Apple Silicon 本机 MLX 服务）——
  api_url: http://127.0.0.1:21567/transcribe
  shared_audio_root: ""
  # 转录模型由原生 MLX 后端管理，应用端只展示安全元数据。
  model: mlx-community/whisper-large-v3-turbo
  timeout: 1800

  # —— openai-api 后端（跨平台，OpenAI 兼容转录服务）——
  # 把 backend 改成 openai-api 后，填写下面的 api_base 与 model，
  # 并在 .env 里填 READ_PODCAST_TRANSCRIPTION_API_KEY。常见选择：
  #   Groq：      api_base https://api.groq.com/openai/v1   model whisper-large-v3
  #   OpenAI：    api_base https://api.openai.com/v1        model whisper-1（单文件≤25MB）
  #   自建服务：  api_base http://127.0.0.1:8000/v1         model Systran/faster-whisper-large-v3
  openai:
    api_base: ""
    model: ""
    language: ""              # 留空自动检测；可填 zh、en 等提升准确率
    timeout: 1800
    max_upload_bytes: 0       # 0 表示不限制；云端接口一般限制 26214400（25MB）

# Prompt templates for WebUI
prompt_templates:
  - name: default
    description: 默认精修模板
    content: |
      请将以下音频转录整理为信息完整、结构清晰的 Markdown 文稿。保留原始内容、论证过程、案例和重要细节，只删除纯粹的口头填充词与无意义重复；不要摘要、臆测或补写录音中没有的信息。根据话题变化添加少量标题，直接输出正文，不要输出额外说明。

  - name: 田野调查访谈整理
    description: 保留现场语境、地方表达与访谈原貌
    content: |
      你是一名严谨的田野调查访谈整理者。请将以下 ASR 原始转录整理为可阅读、可引用的完整访谈稿，不要写成摘要、调研报告或观点评论。

      必须保留访谈中的完整信息、叙事顺序、追问与回答、具体案例、地方知识、方言或特殊称谓，以及受访者的犹豫、转折和不同意见。只删除纯粹的口头填充词、无意义的重复和明显的 ASR 断句问题，不得为了通顺而改写事实或压缩内容。

      只有在原文明确或上下文足够确定时，才标注“访谈者”“受访者”或具体姓名；无法确认的说话人使用“说话人 A”“说话人 B”，不要臆测身份。地名、人名、机构名、方言词和专业词如果无法确认，保留原读音或使用 `[听不清]`、`[疑似：词语]` 标记，不要编造替换。

      按话题变化添加少量 `##` 小标题，但不要改变原始叙事顺序。可以保留少量具有现场感的表达和原话；不要补写录音中没有的环境、动作、情绪或背景信息。直接输出 Markdown 正文，不要输出整理说明。

  - name: 讲座内容整理
    description: 保留完整讲解、论证过程、案例与问答
    content: |
      请将以下音频转录整理为一篇完整、清晰的讲座整理稿，而不是只提取结论的摘要或提纲。

      保留讲者的核心论点、概念定义、论证过程、推导关系、案例、数据、引用、举例和必要的重复解释；保留讲座末尾的提问与回答，并将问答与正式讲解区分开。只删除纯粹的口头填充词、无意义的重复和明显的 ASR 断句问题，不要删掉理解论点所需的上下文。

      根据原文的话题层次使用 `##`、`###` 标题组织内容。专业术语、书名、人名、机构名和数字只有在原文或上下文明确时才修正；无法确认的内容使用 `[听不清]` 或 `[疑似：词语]` 标记，不要凭常识补写。不要虚构讲者信息、课程背景或参考文献。

      使用自然的书面中文，但保留讲者的观点立场和表达逻辑。直接输出 Markdown 讲座整理稿，不要输出摘要、编辑说明或其他解释。

  - name: 会议内容整理
    description: 提炼决策、讨论要点与后续行动
    content: |
      请将以下会议音频转录整理为规范、可执行的 Markdown 会议纪要。

      按以下结构组织：会议主题与基本信息（仅填写录音中明确提到的内容）、参会人员（仅列出明确提到或明确自我介绍的人）、讨论要点、已确认的决策、待确认的问题、后续行动。对每项行动注明负责人、截止时间和依赖事项，但只有在录音中明确说出时才填写；没有信息就写“未提及”，不要猜测。

      清理口头填充词、无意义重复和跑题闲聊，但保留影响决策的理由、分歧、风险、前提条件和未解决意见。严格区分“已决定”“建议/方案”“待确认”和“个人意见”，不要把讨论中的设想写成最终决定，也不要把没有结论的内容强行总结成结论。

      可以使用 `##`、`###` 标题和简洁列表；只有在信息明确且适合对照时才使用表格。直接输出会议纪要，不要输出整理过程或额外说明。

# ── 文件连接器（把成稿一键推送到外部文档/群机器人）──
# 代码不硬编码任何提供商：这里只声明名称、格式与承载 Webhook 地址的环境变量名；
# 真实地址（通常含 token，属机密）只放 .env。format 可选：
#   feishu   飞书自定义机器人（text 消息）
#   dingtalk 钉钉自定义机器人（markdown 消息）
#   slack    Slack / 兼容 Incoming Webhook（text 消息）
#   markdown 通用 Webhook：POST 结构化 JSON（title/podcast/markdown/source_link），
#            可对接自建服务或 Zapier/Make 等，再转存到飞书文档 / Google Drive 等。
# 示例（默认留空；需要时在 config/config.yaml 覆盖，并在 .env 填对应 URL）：
# connectors:
#   - name: 飞书群
#     format: feishu
#     url_env: READ_PODCAST_CONNECTOR_FEISHU_URL
#   - name: 钉钉群
#     format: dingtalk
#     url_env: READ_PODCAST_CONNECTOR_DINGTALK_URL
#   - name: 我的知识库
#     format: markdown
#     url_env: READ_PODCAST_CONNECTOR_WEBHOOK_URL
#     max_chars: 40000
connectors: []

# Example podcasts (manage via WebUI or override in ./config/config.yaml)
podcasts: []
